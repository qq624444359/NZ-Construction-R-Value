# H1/AS1 6th edition — Appendix E, construction R-values of slab-on-ground floors.
#
# Transcribed from Tables E.1.2.1A to E.1.2.1X (MBIE, 27 November 2025) by reading
# the PDF's text layer, then checking every table's foundation, insulation and
# cladding against its own printed title. `verified: false` keeps results flagged
# provisional until a person has compared these against the printed tables.
#
# How the tables are used (see h1/slab.py):
#   - index by the slab area-to-perimeter ratio (E.1.2.2) and the effective
#     thickness of the external walls on the slab;
#   - a ratio between rows takes the NEAREST SMALLER row — never interpolate
#     (note to every table); below 0.6 the tables do not apply (use H1/VM1);
#   - part-perimeter edge insulation and mixed cladding combine by Equations
#     E.3 to E.5, which weight 1/R by the share of perimeter.
#
# Insulation is fixed by the tables: vertical edge R1.0, underslab R1.2 or R2.4,
# either as a 1.2 m strip along the perimeter or full cover. A product only earns
# the highest of those it meets — R3.0 of EPS is credited as R2.4 here; more than
# that needs the H1/VM1 Appendix E calculation (E.1.1.1 b).
#
# Raft tables (A–D) also apply to raft floors with foam pods (their note 1).

