name: Wrong result or problem
description: A number that looks wrong, a check that should or shouldn't fire, or something broken on the page
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: e.g. Wall 90@600 with R2.8 batts shows R1.66 — I expected …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and where does that come from?
      description: The clause, table or calculation you are comparing against.
  - type: textarea
    id: steps
    attributes:
      label: The construction
      description: Type, layers and sizes — or attach the saved project file (Save project → .json).
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows
